name: Synthetic evidence CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Standard-library unit tests
        run: python -m unittest discover -s tests -v
  synthetic-research-evidence:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild synthetic counterfactual evidence
        run: python -m scripts.ci_evidence --out ci-evidence
      - name: Upload reproducible research receipt
        uses: actions/upload-artifact@v4
        with:
          name: observation-integrity-evidence
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 30
  cloud-upstream-evidence:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research project
        uses: actions/checkout@v4
      - name: Checkout pinned ROS3 exporter
        uses: actions/checkout@v4
        with:
          repository: n0711/ROS3-Limassol
          ref: 0de77193ed1c1a9b83b7b38ddc1d3af4e59d6e5e
          path: upstream/ros3
          persist-credentials: false
      - name: Checkout pinned VERA-MOT exporter
        uses: actions/checkout@v4
        with:
          repository: n0711/vera-mot
          ref: c54b0059b2ffcf8f0c6de07feb0a4847a7eec1d8
          path: upstream/vera
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact upstream checkout revisions
        shell: bash
        run: |
          test "$(git -C upstream/ros3 rev-parse HEAD)" = "0de77193ed1c1a9b83b7b38ddc1d3af4e59d6e5e"
          test "$(git -C upstream/vera rev-parse HEAD)" = "c54b0059b2ffcf8f0c6de07feb0a4847a7eec1d8"
      - name: Build pure synthetic fixture
        run: python -m scripts.ci_evidence --out cloud-evidence
      - name: Execute pinned ROS3 demo and evidence exporter (no ROS needed)
        working-directory: upstream/ros3/robotics/ros3_limassol
        shell: bash
        run: |
          python -m ros3_limassol.demo --record "$GITHUB_WORKSPACE/cloud-evidence/ros3-demo.jsonl"
          python -m ros3_limassol.evidence "$GITHUB_WORKSPACE/cloud-evidence/ros3-demo.jsonl" --robot-id usv01 --stale-after 1.0 > "$GITHUB_WORKSPACE/cloud-evidence/ros3-evidence.json"
      - name: Execute pinned VERA-MOT aggregate exporter on synthetic oracle
        shell: bash
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/upstream/vera/src" python -m vera_mot.vision_evidence "$GITHUB_WORKSPACE/cloud-evidence/synthetic-ground-truth-oracle.mot" --sequence synthetic_fixture > "$GITHUB_WORKSPACE/cloud-evidence/vera-evidence.json"
      - name: Produce strictly non-aligned evidence bundle
        shell: bash
        run: |
          python -m space_landing.evidence_bundle cloud-evidence/synthetic-fixture --ros3 cloud-evidence/ros3-evidence.json --vera cloud-evidence/vera-evidence.json > cloud-evidence/offline-bundle.json
          python -m scripts.verify_upstream_ci --root cloud-evidence
      - name: Upload hosted upstream integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: upstream-evidence-receipt
          path: cloud-evidence/
          if-no-files-found: error
          retention-days: 30
