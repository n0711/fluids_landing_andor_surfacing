name: Synthetic evidence CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Standard-library unit tests
        run: python -m unittest discover -s tests -v
  synthetic-research-evidence:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild synthetic counterfactual evidence
        run: python -m scripts.ci_evidence --out ci-evidence
      - name: Upload reproducible research receipt
        uses: actions/upload-artifact@v4
        with:
          name: observation-integrity-evidence
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 30
